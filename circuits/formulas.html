.fx-ch{margin:18px 0 6px;font-size:1.25rem}
.fx-card{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--surface)}
.fx-card h3{margin:0 0 6px;font-size:1.02rem;color:var(--accent)}
.fx-card h3 small{color:var(--muted);font-weight:500;margin-left:6px}
.fx-f{margin:4px 0;font-size:1.02rem;font-weight:600;overflow-wrap:anywhere}
.fx-f span{display:block;font-weight:400;font-size:.86rem;color:var(--muted)}

.fx-trap{margin-top:4px;font-size:.88rem;color:var(--muted)}
</style>

    <div id="fx"></div>

<script src="../shared/app.js"></script>
<script src="../shared/terms.js"></script>
<script src="assets/ch11-types.js"></script>
<script src="assets/ch12-types.js"></script>
<script src="assets/ch13-types.js"></script>
<script src="assets/ch14-types.js"></script>
<script>
(function () {
  var NAME = { 11: 'CH11 交流功率', 12: 'CH12 三相電路', 13: 'CH13 磁耦合', 14: 'CH14 頻率響應（到 14.3）' };
  var SKIP = /^(12\.9|12\.10|13\.8|13\.9)/;
  var h = '';
  [11, 12, 13, 14].forEach(function (c) {
    var D = window['__TYPES' + c]; if (!D) return;
    h += '<h2 class="fx-ch">' + NAME[c] + '</h2>';
    D.types.forEach(function (t) {
      if (SKIP.test(String(t.sec))) return;
      h += '<div class="fx-card"><h3>' + t.n + '<small>' + t.sec + '</small></h3>' +
        t.f.map(function (r) { return '<div class="fx-f">' + r[0] + '<span>' + r[1] + '</span></div>'; }).join('') +
        '<div class="fx-key">🔑 ' + t.key + '</div>' +
        (t.trap ? '<div class="fx-trap">' + t.trap[0] + '　' + t.trap[1] + '：' + t.trap[2] + '</div>' : '') + '</div>';
    });
  });
  document.getElementById('fx').innerHTML = h;
})();
</script>
<script src="../shared/track.js"></script>
</body>
