<style>
.mk-sec h2{margin-bottom:4px} .mk-hint{color:var(--ink-3);font-size:.9rem;margin:0 0 10px}
.mk-card{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--surface)}
.mk-card.mk-right{border-left-color:var(--ok)} .mk-card.mk-wrong{border-left-color:var(--bad)}
.mk-h{display:flex;gap:8px;align-items:center;font-size:.82rem} .mk-no{color:var(--ink-3)}
.mk-tag{font-weight:700;border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.mk-q{font-size:1.05rem;font-weight:600;margin:8px 0 10px;line-height:1.6}
.mk-ta{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.mk-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mk-in{width:9em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.mk-opts{display:grid;gap:8px}
.mk-opt{text-align:left;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.mk-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);font-weight:700}
.mk-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mk-ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.mk-ok{font-weight:700;margin-bottom:4px} .mk-chk,.mk-steps{margin:4px 0 8px;padding-left:1.3em;line-height:1.7}
.mk-model{line-height:1.8;margin:4px 0 8px} .mk-model b,.mk-steps b{color:var(--accent)}
.mk-score{margin-bottom:6px} .mk-kws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mk-kw{border-radius:6px;padding:1px 8px;font-size:.85rem;font-weight:600}
.mk-kw.y{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)} .mk-kw.n{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.mk-res{font-size:1.05rem;margin-bottom:6px} .mk-res.y{color:var(--ok)} .mk-res.n{color:var(--bad)}
.mk-fig{margin:6px 0} .mf{width:100%;height:auto;display:block;margin:6px 0}
.mf .bx{fill:var(--paper);stroke:var(--ink);stroke-width:1.6} .mf .bx.a{stroke:var(--accent);stroke-width:2.4;fill:color-mix(in srgb,var(--accent) 10%,var(--paper))}
.mf .bt{fill:var(--ink);font:600 15px "Noto Sans TC",sans-serif;text-anchor:middle} .mf .bt.a{fill:var(--accent)}
.mf .tx{fill:var(--ink);font:500 15px "Noto Sans TC",sans-serif} .mf .tx.b{font-weight:700} .mf .tx.a{fill:var(--accent);font-weight:700} .mf .tx.s{fill:var(--ink-3);font-size:14px}
.mf .ar{stroke:var(--ink-2);stroke-width:2} .mf .ar.a{stroke:var(--accent);stroke-width:3} .mf .ah{fill:var(--ink-2)}
.mf .ln{stroke:var(--ink);stroke-width:2} .mf .lp{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 5}
.mf .wire{stroke:var(--ink-3);stroke-width:4} .mf .wire.hot{stroke:var(--bad);stroke-width:10}
.pic{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.pt{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 8px;min-width:56px;background:var(--paper)}
.pe{font-size:1.6rem;line-height:1.2} .pw{font-size:.8rem;font-weight:600;text-align:center} .pa{color:var(--ink-3);font-weight:700}
.mk-ref{font-size:.88rem}
.mk-jump{display:flex;flex-wrap:wrap;gap:8px}
