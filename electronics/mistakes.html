      <p class="sub">各章答錯的<strong>測驗、作業、Practice</strong> 會自動收進來。<b class="trk-b ng">✗ 答錯</b> 是還沒訂正的；回去再做一次答對，就變成 <b class="trk-b fix">已訂正</b>，紀錄會留著讓你考前複習。按 ✕ 會刪掉那一筆紀錄。</p>

    <div id="mk-book" data-chs='[[&quot;electronics/ch1-part1&quot;, &quot;CH1 PART 1 半導體材料與性質&quot;], [&quot;electronics/ch1-part2&quot;, &quot;CH1 PART 2 P 型半導體與載子輸運&quot;], [&quot;electronics/ch1-part3&quot;, &quot;CH1 PART 3 pn 接面&quot;], [&quot;electronics/ch1-part4&quot;, &quot;CH1 PART 4 順向偏壓與 I–V&quot;], [&quot;electronics/midterm1&quot;, &quot;期中考 1 複習（老師範例題組）&quot;], [&quot;electronics/practice1&quot;, &quot;CH1 課本練習題&quot;], [&quot;electronics/hw1&quot;, &quot;HW1 作業（總複習頁）&quot;]]'></div>

<script src="../shared/terms.js"></script>
<script>
(function () {
  var btn = document.getElementById('theme-btn');
  btn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    try { localStorage.setItem('ee-theme', isDark ? 'light' : 'dark'); } catch (e) {}
  });
  try { var t = localStorage.getItem('ee-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
})();
</script>
<script src="../shared/track.js"></script>
